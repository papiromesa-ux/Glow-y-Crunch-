<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatos de Restaurante - Proyecto Escolar</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-madera-oscuro: #3e2723;
            --color-madera-medio: #5d4037;
            --color-madera-claro: #8d6e63;
            --color-crema: #f5f0e6;
            --color-dorado: #c9a84c;
            --color-vino: #722f37;
            --color-texto: #2c2c2c;
            --color-blanco: #ffffff;
            --sombra: 0 6px 20px rgba(0,0,0,0.15);
            --radio: 10px;
            --transicion: 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--color-crema);
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(139,69,19,0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(139,69,19,0.05) 0%, transparent 50%);
            min-height: 100vh;
            color: var(--color-texto);
            line-height: 1.6;
            padding: 0;
        }

        /* ===== HEADER ===== */
        .header-restaurante {
            background: linear-gradient(135deg, var(--color-madera-oscuro) 0%, var(--color-madera-medio) 50%, var(--color-madera-oscuro) 100%);
            color: var(--color-crema);
            text-align: center;
            padding: 2.5rem 1rem;
            border-bottom: 5px solid var(--color-dorado);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
        }

        .header-restaurante::before {
            content: "🍽️";
            font-size: 3rem;
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.3;
        }

        .header-restaurante::after {
            content: "🍷";
            font-size: 2.5rem;
            position: absolute;
            right: 25px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.3;
        }

        .header-restaurante h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            letter-spacing: 2px;
            margin-bottom: 0.3rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .header-restaurante .subtitulo {
            font-size: 1.2rem;
            opacity: 0.9;
            font-style: italic;
        }

        /* ===== CONTENEDOR PRINCIPAL ===== */
        .contenedor {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1.5rem 4rem;
        }

        /* ===== CATEGORÍAS (VIÑETAS PRINCIPALES) ===== */
        .categoria {
            background: var(--color-blanco);
            border-radius: var(--radio);
            box-shadow: var(--sombra);
            margin-bottom: 2rem;
            overflow: hidden;
            border-left: 8px solid var(--color-dorado);
            transition: all var(--transicion);
        }

        .categoria:hover {
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transform: translateY(-2px);
        }

        .categoria-header {
            background: linear-gradient(135deg, var(--color-madera-medio), var(--color-madera-oscuro));
            color: var(--color-crema);
            padding: 1.3rem 2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            user-select: none;
        }

        .categoria-header:hover {
            background: linear-gradient(135deg, var(--color-madera-claro), var(--color-madera-medio));
        }

        .categoria-header .titulo-categoria {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .categoria-header .icono-categoria {
            font-size: 2rem;
        }

        .categoria-header .indicador {
            font-size: 1.5rem;
            transition: transform var(--transicion);
        }

        .categoria.abierta .indicador {
            transform: rotate(90deg);
        }

        .categoria-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease;
            background: #fdfbf7;
        }

        .categoria.abierta .categoria-body {
            max-height: 3000px;
        }

        /* ===== SUBTEMAS ===== */
        .subtema {
            border-bottom: 1px solid #e8e0d5;
        }

        .subtema:last-child {
            border-bottom: none;
        }

        .subtema-header {
            padding: 1rem 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 1rem;
            background: #faf6f0;
            transition: background var(--transicion);
            user-select: none;
        }

        .subtema-header:hover {
            background: #f0e8dd;
        }

        .subtema-header .numero {
            background: var(--color-dorado);
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .subtema-header .titulo-subtema {
            font-weight: 500;
            flex: 1;
            font-size: 1.1rem;
        }

        .subtema-header .flecha {
            font-size: 1.2rem;
            transition: transform var(--transicion);
        }

        .subtema.abierto .flecha {
            transform: rotate(90deg);
        }

        .subtema-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease;
            background: white;
            padding: 0 1.5rem;
        }

        .subtema.abierto .subtema-body {
            max-height: 2000px;
            padding: 1.5rem;
        }

        /* ===== CONTENEDOR DE IMÁGENES Y DESCRIPCIÓN ===== */
        .contenedor-imagenes {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .slot-imagen {
            flex: 1;
            min-width: 250px;
            background: #f5f0e6;
            border: 2px dashed #c9a84c;
            border-radius: var(--radio);
            padding: 1rem;
            text-align: center;
            position: relative;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .slot-imagen .etiqueta {
            font-weight: bold;
            color: var(--color-madera-medio);
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .slot-imagen img {
            max-width: 100%;
            max-height: 250px;
            border-radius: 6px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            display: none;
        }

        .slot-imagen img.visible {
            display: block;
        }

        .slot-imagen .boton-agregar {
            background: var(--color-dorado);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all var(--transicion);
            margin-top: 0.5rem;
        }

        .slot-imagen .boton-agregar:hover {
            background: #b8963c;
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(201,168,76,0.4);
        }

        .slot-imagen .boton-agregar:disabled {
            background: #cccccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* ===== MODAL PARA AGREGAR IMAGEN ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal-overlay.activo {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-contenido {
            background: white;
            border-radius: var(--radio);
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            position: relative;
        }

        .modal-contenido h3 {
            font-family: 'Playfair Display', serif;
            color: var(--color-madera-oscuro);
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .modal-opciones {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .modal-opciones .opcion {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .modal-opciones label {
            font-weight: 500;
            color: var(--color-madera-medio);
        }

        .modal-opciones input[type="file"] {
            padding: 0.5rem;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        .modal-opciones input[type="url"] {
            padding: 0.7rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .modal-botones {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
            justify-content: center;
        }

        .modal-botones button {
            padding: 0.7rem 1.8rem;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 500;
            transition: all var(--transicion);
        }

        .btn-confirmar {
            background: var(--color-dorado);
            color: white;
        }

        .btn-confirmar:hover {
            background: #b8963c;
        }

        .btn-cancelar {
            background: #e0e0e0;
            color: #333;
        }

        .btn-cancelar:hover {
            background: #cccccc;
        }

        /* ===== DESCRIPCIÓN ===== */
        .area-descripcion {
            background: #fdfbf7;
            border: 1px solid #e0d6c8;
            border-radius: var(--radio);
            padding: 1.2rem;
        }

        .area-descripcion label {
            font-weight: 500;
            color: var(--color-madera-medio);
            display: block;
            margin-bottom: 0.5rem;
            font-size: 1rem;
        }

        .area-descripcion textarea {
            width: 100%;
            min-height: 100px;
            padding: 0.8rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-family: 'Roboto', sans-serif;
            font-size: 0.95rem;
            resize: vertical;
            background: white;
        }

        .area-descripcion textarea:focus {
            outline: none;
            border-color: var(--color-dorado);
            box-shadow: 0 0 0 2px rgba(201,168,76,0.2);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .header-restaurante h1 {
                font-size: 2rem;
            }
            .header-restaurante::before,
            .header-restaurante::after {
                display: none;
            }
            .categoria-header .titulo-categoria {
                font-size: 1.3rem;
            }
            .contenedor-imagenes {
                flex-direction: column;
            }
            .slot-imagen {
                min-width: auto;
            }
            .subtema-header {
                padding: 0.8rem 1rem;
            }
            .subtema-body {
                padding: 0 1rem;
            }
            .subtema.abierto .subtema-body {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="header-restaurante">
        <h1>🍽️ Formatos de Restaurante</h1>
        <p class="subtitulo">Formularios utilizados en restaurantes de categoría</p>
    </header>

    <!-- ===== CONTENEDOR PRINCIPAL ===== -->
    <div class="contenedor" id="contenedor-principal">
        <!-- El contenido se genera dinámicamente con JavaScript -->
    </div>

    <!-- ===== MODAL PARA AGREGAR IMAGEN ===== -->
    <div class="modal-overlay" id="modal-imagen">
        <div class="modal-contenido">
            <h3>Agregar Imagen</h3>
            <div class="modal-opciones">
                <div class="opcion">
                    <label for="input-archivo">📁 Subir archivo:</label>
                    <input type="file" id="input-archivo" accept="image/*">
                </div>
                <div class="opcion">
                    <label for="input-url">🔗 Pegar URL de imagen:</label>
                    <input type="url" id="input-url" placeholder="https://ejemplo.com/imagen.jpg">
                </div>
            </div>
            <div class="modal-botones">
                <button class="btn-confirmar" id="btn-confirmar-imagen">Aceptar</button>
                <button class="btn-cancelar" id="btn-cancelar-imagen">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // 📌 DATOS DEL PROYECTO - Estructura de categorías y subtemas
        //    con descripciones precargadas
        // ============================================================

        const datosCategorias = [
            {
                titulo: "Sala/Servicio",
                icono: "🍽️",
                subtemas: [
                    { titulo: "Comanda (cocina/barra/caja)", descripcion: "Ticket interno que comunica a cocina, barra y caja los pedidos de los clientes." },
                    { titulo: "Hoja de reservas", descripcion: "Registro de clientes con hora, n.º de comensales y peticiones especiales para el servicio." },
                    { titulo: "Plano de distribución de mesas", descripcion: "Esquema visual para organizar la asignación de mesas y optimizar el rango de los camareros." },
                    { titulo: "Ficha de alérgenos por comensal", descripcion: "Registro puntual de las restricciones alimentarias e intolerancias de un cliente específico." },
                    { titulo: "BEO (Banquet Event Order)", descripcion: "Documento con todos los detalles técnicos, menú y horarios de un evento o banquete." }
                ]
            },
            {
                titulo: "Cocina",
                icono: "👨‍🍳",
                subtemas: [
                    { titulo: "Ficha técnica de plato", descripcion: "Documento con la receta paso a paso, ingredientes, costes y escandallo del plato." },
                    { titulo: "Control de temperaturas APPCC/HACCP", descripcion: "Registro diario para asegurar que los equipos de frío conservan los alimentos a temperatura segura." },
                    { titulo: "Control de trazabilidad", descripcion: "Registro del origen, lote y recorrido de los ingredientes desde su origen hasta el plato." },
                    { titulo: "Hoja de mermas y desperdicios", descripcion: "Control del alimento descartado por deterioro, mal estado o errores en cocina." },
                    { titulo: "Control de caducidades (PEPS/FIFO)", descripcion: "Sistema para organizar los productos garantizando que lo primero en entrar sea lo primero en salir." }
                ]
            },
            {
                titulo: "Almacén/Compras",
                icono: "📦",
                subtemas: [
                    { titulo: "Hoja de pedido a proveedores", descripcion: "Lista oficial de insumos solicitados para reponer el stock." },
                    { titulo: "Albarán de recepción", descripcion: "Documento de entrega para verificar que lo recibido coincide con lo pedido y está en buen estado." },
                    { titulo: "Control de stock e inventario", descripcion: "Registro físico de la cantidad de materia prima disponible en el almacén." },
                    { titulo: "Control de temperatura de cámaras", descripcion: "Verificación de las zonas de almacenamiento frío del almacén para evitar roturas de cadena de frío." },
                    { titulo: "Control de rotación de stock (FIFO)", descripcion: "Organización física en estanterías para ubicar al frente los productos con fecha de expiración más próxima." }
                ]
            },
            {
                titulo: "Administración",
                icono: "💼",
                subtemas: [
                    { titulo: "Control de caja diario", descripcion: "Registro continuo de las entradas y salidas de efectivo y cobros con tarjeta durante la jornada." },
                    { titulo: "Arqueo/cierre de caja", descripcion: "Conteo físico del dinero al final del día para comprobar que coincide con las ventas registradas." },
                    { titulo: "Control de turnos y horarios", descripcion: "Planificación del cuadrante laboral del personal, horas trabajadas y libranzas." },
                    { titulo: "Balance diario de ventas", descripcion: "Resumen financiero del día que analiza ingresos totales, ticket medio y platos más vendidos." },
                    { titulo: "Parte de incidencias", descripcion: "Informe de contratiempos, averías de maquinaria, desperfectos o problemas con clientes/personal." }
                ]
            }
        ];

        // ============================================================
        // ESTADO INICIAL - Se carga desde localStorage o se crea con
        //    las descripciones precargadas
        // ============================================================
        const CLAVE_STORAGE = 'formatos_restaurante_v1';

        function cargarEstado() {
            const guardado = localStorage.getItem(CLAVE_STORAGE);
            if (guardado) {
                try {
                    const estadoParseado = JSON.parse(guardado);
                    // Asegurar que las descripciones precargadas no se pierdan si el usuario borra localStorage
                    return estadoParseado;
                } catch (e) {
                    console.warn('Error al leer localStorage, usando estado con descripciones');
                }
            }
            return crearEstadoVacio();
        }

        function crearEstadoVacio() {
            const estado = {};
            datosCategorias.forEach((cat, idxCat) => {
                estado[idxCat] = {};
                cat.subtemas.forEach((sub, idxSub) => {
                    estado[idxCat][idxSub] = {
                        imagenIzquierda: null,
                        imagenDerecha: null,
                        descripcion: sub.descripcion  // <-- Descripción precargada
                    };
                });
            });
            return estado;
        }

        let estadoActual = cargarEstado();

        function guardarEstado() {
            localStorage.setItem(CLAVE_STORAGE, JSON.stringify(estadoActual));
        }

        // ============================================================
        // RENDERIZADO DE LA INTERFAZ
        // ============================================================
        const contenedor = document.getElementById('contenedor-principal');

        function renderizarTodo() {
            let html = '';
            datosCategorias.forEach((categoria, idxCat) => {
                const abiertaCat = estadoActual._categoriasAbiertas ? estadoActual._categoriasAbiertas.includes(idxCat) : false;
                html += `
                    <div class="categoria ${abiertaCat ? 'abierta' : ''}" data-cat="${idxCat}">
                        <div class="categoria-header" data-cat="${idxCat}">
                            <div class="titulo-categoria">
                                <span class="icono-categoria">${categoria.icono}</span>
                                ${categoria.titulo}
                            </div>
                            <span class="indicador">▶</span>
                        </div>
                        <div class="categoria-body">
                `;
                categoria.subtemas.forEach((subtemaObj, idxSub) => {
                    const subEstado = estadoActual[idxCat]?.[idxSub] || {};
                    const abiertoSub = estadoActual._subtemasAbiertos ? estadoActual._subtemasAbiertos.includes(`${idxCat}-${idxSub}`) : false;
                    html += `
                        <div class="subtema ${abiertoSub ? 'abierto' : ''}" data-sub="${idxCat}-${idxSub}">
                            <div class="subtema-header" data-sub="${idxCat}-${idxSub}">
                                <span class="numero">${idxSub + 1}</span>
                                <span class="titulo-subtema">${subtemaObj.titulo}</span>
                                <span class="flecha">▶</span>
                            </div>
                            <div class="subtema-body">
                                <div class="contenedor-imagenes">
                                    <!-- Imagen Izquierda -->
                                    <div class="slot-imagen" data-slot="izquierda" data-cat="${idxCat}" data-sub="${idxSub}">
                                        <div class="etiqueta">Imagen Izquierda</div>
                                        <img id="img-izq-${idxCat}-${idxSub}" class="${subEstado.imagenIzquierda ? 'visible' : ''}" 
                                             src="${subEstado.imagenIzquierda || '#'}" alt="Imagen izquierda">
                                        <button class="boton-agregar" data-slot="izquierda" data-cat="${idxCat}" data-sub="${idxSub}"
                                            ${subEstado.imagenIzquierda ? 'disabled' : ''}>
                                            ${subEstado.imagenIzquierda ? '✔ Imagen agregada' : '➕ Agregar imagen'}
                                        </button>
                                    </div>
                                    <!-- Imagen Derecha -->
                                    <div class="slot-imagen" data-slot="derecha" data-cat="${idxCat}" data-sub="${idxSub}">
                                        <div class="etiqueta">Imagen Derecha</div>
                                        <img id="img-der-${idxCat}-${idxSub}" class="${subEstado.imagenDerecha ? 'visible' : ''}" 
                                             src="${subEstado.imagenDerecha || '#'}" alt="Imagen derecha">
                                        <button class="boton-agregar" data-slot="derecha" data-cat="${idxCat}" data-sub="${idxSub}"
                                            ${subEstado.imagenDerecha ? 'disabled' : ''}>
                                            ${subEstado.imagenDerecha ? '✔ Imagen agregada' : '➕ Agregar imagen'}
                                        </button>
                                    </div>
                                </div>
                                <div class="area-descripcion">
                                    <label for="desc-${idxCat}-${idxSub}">📝 Descripción de las imágenes:</label>
                                    <textarea id="desc-${idxCat}-${idxSub}" 
                                              placeholder="Escribe aquí la descripción de este formato..."
                                              data-cat="${idxCat}" data-sub="${idxSub}">${subEstado.descripcion || ''}</textarea>
                                </div>
                            </div>
                        </div>
                    `;
                });
                html += `
                        </div>
                    </div>
                `;
            });
            contenedor.innerHTML = html;
            adjuntarEventos();
        }

        // ============================================================
        // EVENTOS
        // ============================================================
        function adjuntarEventos() {
            document.querySelectorAll('.categoria-header').forEach(header => {
                header.addEventListener('click', (e) => {
                    const idxCat = parseInt(e.currentTarget.dataset.cat);
                    toggleCategoria(idxCat);
                });
            });

            document.querySelectorAll('.subtema-header').forEach(header => {
                header.addEventListener('click', (e) => {
                    const subKey = e.currentTarget.dataset.sub;
                    toggleSubtema(subKey);
                });
            });

            document.querySelectorAll('.boton-agregar').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const slot = e.currentTarget.dataset.slot;
                    const idxCat = parseInt(e.currentTarget.dataset.cat);
                    const idxSub = parseInt(e.currentTarget.dataset.sub);
                    abrirModalImagen(slot, idxCat, idxSub);
                });
            });

            document.querySelectorAll('textarea[data-cat]').forEach(textarea => {
                textarea.addEventListener('input', (e) => {
                    const idxCat = parseInt(e.target.dataset.cat);
                    const idxSub = parseInt(e.target.dataset.sub);
                    estadoActual[idxCat][idxSub].descripcion = e.target.value;
                    guardarEstado();
                });
            });
        }

        function toggleCategoria(idxCat) {
            if (!estadoActual._categoriasAbiertas) {
                estadoActual._categoriasAbiertas = [];
            }
            const index = estadoActual._categoriasAbiertas.indexOf(idxCat);
            if (index > -1) {
                estadoActual._categoriasAbiertas.splice(index, 1);
            } else {
                estadoActual._categoriasAbiertas.push(idxCat);
            }
            guardarEstado();
            renderizarTodo();
        }

        function toggleSubtema(subKey) {
            if (!estadoActual._subtemasAbiertos) {
                estadoActual._subtemasAbiertos = [];
            }
            const index = estadoActual._subtemasAbiertos.indexOf(subKey);
            if (index > -1) {
                estadoActual._subtemasAbiertos.splice(index, 1);
            } else {
                estadoActual._subtemasAbiertos.push(subKey);
            }
            guardarEstado();
            renderizarTodo();
        }

        // ============================================================
        // MODAL PARA AGREGAR IMAGEN
        // ============================================================
        const modalOverlay = document.getElementById('modal-imagen');
        const inputArchivo = document.getElementById('input-archivo');
        const inputUrl = document.getElementById('input-url');
        const btnConfirmar = document.getElementById('btn-confirmar-imagen');
        const btnCancelar = document.getElementById('btn-cancelar-imagen');

        let modalContexto = {
            slot: null,
            idxCat: null,
            idxSub: null
        };

        function abrirModalImagen(slot, idxCat, idxSub) {
            modalContexto = { slot, idxCat, idxSub };
            inputArchivo.value = '';
            inputUrl.value = '';
            modalOverlay.classList.add('activo');
        }

        function cerrarModalImagen() {
            modalOverlay.classList.remove('activo');
            modalContexto = { slot: null, idxCat: null, idxSub: null };
        }

        btnCancelar.addEventListener('click', cerrarModalImagen);

        btnConfirmar.addEventListener('click', () => {
            const { slot, idxCat, idxSub } = modalContexto;
            if (slot === null) return;

            if (inputArchivo.files && inputArchivo.files.length > 0) {
                const archivo = inputArchivo.files[0];
                const lector = new FileReader();
                lector.onload = (e) => {
                    const dataUrl = e.target.result;
                    if (slot === 'izquierda') {
                        estadoActual[idxCat][idxSub].imagenIzquierda = dataUrl;
                    } else {
                        estadoActual[idxCat][idxSub].imagenDerecha = dataUrl;
                    }
                    guardarEstado();
                    renderizarTodo();
                    cerrarModalImagen();
                };
                lector.readAsDataURL(archivo);
            } 
            else if (inputUrl.value.trim() !== '') {
                const url = inputUrl.value.trim();
                if (slot === 'izquierda') {
                    estadoActual[idxCat][idxSub].imagenIzquierda = url;
                } else {
                    estadoActual[idxCat][idxSub].imagenDerecha = url;
                }
                guardarEstado();
                renderizarTodo();
                cerrarModalImagen();
            } else {
                alert('Por favor selecciona un archivo o pega una URL de imagen.');
            }
        });

        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                cerrarModalImagen();
            }
        });

        // ============================================================
        // INICIAR
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            renderizarTodo();
        });
    </script>
</body>
</html>

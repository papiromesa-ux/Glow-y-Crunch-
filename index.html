<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatos de Formularios - Restaurante de Categoría</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,600&family=Lato:wght@300;400;700&family=Cormorant+Garamond:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

    <style>
        /* ========== VARIABLES Y RESET ========== */
        :root {
            --color-bg: #faf6ef;
            --color-bg-dark: #f0e8d8;
            --color-primary: #2c1810;
            --color-primary-light: #4a3020;
            --color-secondary: #8b4513;
            --color-accent: #c9a96e;
            --color-accent-light: #e8d5b0;
            --color-wine: #722f37;
            --color-wine-light: #a0522d;
            --color-text: #3d2b1f;
            --color-text-light: #6b5a4a;
            --color-white: #ffffff;
            --color-card: #fffdf9;
            --color-border: #d4c5a9;
            --color-success: #4a7c59;
            --color-shadow: rgba(44, 24, 16, 0.12);
            --color-shadow-hover: rgba(44, 24, 16, 0.2);
            --font-title: 'Playfair Display', 'Cormorant Garamond', serif;
            --font-body: 'Lato', 'Segoe UI', sans-serif;
            --radius: 16px;
            --radius-sm: 10px;
            --radius-xs: 6px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--color-bg);
            background-image:
                radial-gradient(ellipse at top left, rgba(201, 169, 110, 0.12) 0%, transparent 60%),
                radial-gradient(ellipse at bottom right, rgba(114, 47, 55, 0.08) 0%, transparent 60%),
                url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c9a96e' fill-opacity='0.06'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            color: var(--color-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.6;
            position: relative;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 120px;
            background: linear-gradient(to top, rgba(44, 24, 16, 0.03), transparent);
            pointer-events: none;
            z-index: -1;
        }

        /* ========== HEADER ========== */
        .app-header {
            width: 100%;
            max-width: 1200px;
            padding: 1.5rem 1.5rem 0.8rem;
            text-align: center;
            position: relative;
        }

        .app-header::after {
            content: '';
            display: block;
            width: 120px;
            height: 3px;
            background: linear-gradient(to right, transparent, var(--color-accent), transparent);
            margin: 0.8rem auto 0;
            border-radius: 2px;
        }

        .app-header .restaurant-icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 0.3rem;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .app-header h1 {
            font-family: var(--font-title);
            font-size: clamp(1.6rem, 4vw, 2.4rem);
            font-weight: 900;
            color: var(--color-primary);
            letter-spacing: 0.02em;
            line-height: 1.2;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }

        .app-header .subtitle {
            font-family: var(--font-title);
            font-style: italic;
            font-size: clamp(0.95rem, 2vw, 1.15rem);
            color: var(--color-wine);
            margin-top: 0.25rem;
            letter-spacing: 0.05em;
        }

        /* ========== USER BAR ========== */
        .user-bar {
            width: 100%;
            max-width: 1200px;
            padding: 0.5rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            font-size: 0.9rem;
        }

        .user-bar .user-name {
            font-weight: 600;
            color: var(--color-primary);
            background: rgba(201, 169, 110, 0.15);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            border: 1px solid var(--color-accent);
        }

        .user-bar .logout-btn {
            background: none;
            border: none;
            color: var(--color-wine);
            cursor: pointer;
            font-family: var(--font-body);
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: underline;
            text-underline-offset: 3px;
            transition: var(--transition);
        }

        .user-bar .logout-btn:hover {
            color: var(--color-secondary);
        }

        /* ========== BREADCRUMB ========== */
        .breadcrumb {
            width: 100%;
            max-width: 1200px;
            padding: 0.5rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            flex-wrap: wrap;
            font-size: 0.85rem;
            color: var(--color-text-light);
            min-height: 2.2rem;
        }

        .breadcrumb button {
            background: none;
            border: none;
            color: var(--color-secondary);
            cursor: pointer;
            font-family: var(--font-body);
            font-size: 0.85rem;
            font-weight: 600;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            transition: var(--transition);
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .breadcrumb button:hover {
            color: var(--color-wine);
            background: rgba(201, 169, 110, 0.15);
        }

        .breadcrumb .separator {
            color: var(--color-accent);
            font-weight: bold;
            user-select: none;
        }

        .breadcrumb .current {
            color: var(--color-text);
            font-weight: 700;
            background: rgba(201, 169, 110, 0.2);
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            font-size: 0.82rem;
        }

        /* ========== MAIN CONTAINER ========== */
        .main-container {
            width: 100%;
            max-width: 1200px;
            padding: 0.5rem 1.5rem 2rem;
            flex: 1;
        }

        /* ========== VISTAS ========== */
        .view {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .view.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .view-categories .section-label {
            text-align: center;
            font-family: var(--font-title);
            font-size: 1.1rem;
            font-style: italic;
            color: var(--color-text-light);
            margin-bottom: 1.8rem;
            letter-spacing: 0.04em;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
            padding: 0.5rem 0;
        }

        .category-card {
            background: var(--color-card);
            border: 2px solid var(--color-border);
            border-radius: var(--radius);
            padding: 2rem 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 15px var(--color-shadow);
            position: relative;
            overflow: hidden;
            user-select: none;
            background-image: radial-gradient(circle at 20% 30%, rgba(201,169,110,0.05) 0%, transparent 50%);
        }

        .category-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(to right, var(--color-accent), var(--color-wine));
            opacity: 0;
            transition: var(--transition);
        }

        .category-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 40px;
            height: 40px;
            background: radial-gradient(circle at bottom right, rgba(201,169,110,0.1), transparent);
            border-radius: 0 0 var(--radius) 0;
        }

        .category-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 30px var(--color-shadow-hover);
            border-color: var(--color-accent);
        }

        .category-card:hover::before {
            opacity: 1;
        }

        .category-card .icon {
            font-size: 3.2rem;
            display: block;
            margin-bottom: 1rem;
            transition: var(--transition);
        }

        .category-card:hover .icon {
            transform: scale(1.15) rotate(-5deg);
        }

        .category-card h3 {
            font-family: var(--font-title);
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--color-primary);
            margin-bottom: 0.4rem;
        }

        .category-card .item-count {
            font-size: 0.82rem;
            color: var(--color-text-light);
            font-weight: 300;
            letter-spacing: 0.03em;
        }

        /* ========== VISTA SUBTEMAS ========== */
        .subtopics-header {
            text-align: center;
            margin-bottom: 1.8rem;
        }

        .subtopics-header .cat-icon {
            font-size: 2.5rem;
            display: block;
        }

        .subtopics-header h2 {
            font-family: var(--font-title);
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--color-primary);
            margin-top: 0.3rem;
        }

        .subtopics-list {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            max-width: 700px;
            margin: 0 auto;
        }

        .subtopic-item {
            background: var(--color-card);
            border: 1.5px solid var(--color-border);
            border-radius: var(--radius-sm);
            padding: 1.1rem 1.4rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 1rem;
            font-family: var(--font-body);
            font-size: 1rem;
            font-weight: 500;
            color: var(--color-text);
            box-shadow: 0 2px 8px var(--color-shadow);
            user-select: none;
            position: relative;
            overflow: hidden;
        }

        .subtopic-item::after {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--color-accent);
            transform: scaleY(0);
            transition: transform 0.3s;
        }

        .subtopic-item:hover {
            border-color: var(--color-accent);
            transform: translateX(6px);
            box-shadow: 0 6px 18px var(--color-shadow-hover);
            background: #fffefb;
        }

        .subtopic-item:hover::after {
            transform: scaleY(1);
        }

        .subtopic-item .number {
            background: var(--color-accent-light);
            color: var(--color-primary);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
            flex-shrink: 0;
            transition: var(--transition);
        }

        .subtopic-item:hover .number {
            background: var(--color-accent);
            color: var(--color-white);
            transform: scale(1.1);
        }

        .subtopic-item .arrow {
            margin-left: auto;
            color: var(--color-accent);
            font-size: 1.2rem;
            transition: var(--transition);
        }

        .subtopic-item:hover .arrow {
            transform: translateX(4px);
            color: var(--color-wine);
        }

        /* ========== VISTA DETALLE ========== */
        .detail-header {
            text-align: center;
            margin-bottom: 0.8rem;
        }

        .detail-header h2 {
            font-family: var(--font-title);
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--color-primary);
            line-height: 1.3;
        }

        .detail-header .breadcrumb-hint {
            font-size: 0.85rem;
            color: var(--color-text-light);
            font-style: italic;
            margin-top: 0.2rem;
        }

        .official-description-box {
            background: rgba(201, 169, 110, 0.1);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            padding: 0.8rem 1.2rem;
            margin: 0.5rem auto 1.5rem;
            max-width: 800px;
            text-align: center;
            font-size: 0.95rem;
            color: var(--color-text);
            font-style: italic;
            box-shadow: 0 2px 8px var(--color-shadow);
            position: relative;
        }

        .official-description-box::before {
            content: '📋';
            position: absolute;
            left: 10px;
            top: -12px;
            font-size: 1.2rem;
            background: var(--color-bg);
            padding: 0 5px;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            max-width: 1000px;
            margin: 0 auto;
        }

        .image-panel {
            background: var(--color-card);
            border: 2px solid var(--color-border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 4px 15px var(--color-shadow);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
        }

        .image-panel:hover {
            border-color: var(--color-accent);
            box-shadow: 0 8px 25px var(--color-shadow-hover);
        }

        .panel-label {
            text-align: center;
            font-family: var(--font-title);
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--color-text-light);
            padding: 0.7rem 1rem;
            background: rgba(201, 169, 110, 0.1);
            border-bottom: 1px solid var(--color-border);
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .image-area {
            flex: 1;
            min-height: 260px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: rgba(240, 232, 216, 0.4);
            cursor: pointer;
            transition: var(--transition);
            overflow: hidden;
        }

        .image-area.has-image {
            cursor: zoom-in;
        }

        .image-area .placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.6rem;
            color: var(--color-text-light);
            padding: 1.5rem;
            text-align: center;
            transition: var(--transition);
        }

        .image-area .placeholder .icon {
            font-size: 3.5rem;
            opacity: 0.5;
            transition: var(--transition);
        }

        .image-area .placeholder p {
            font-size: 0.9rem;
            font-weight: 400;
            max-width: 200px;
        }

        .image-area .btn-add-image {
            background: var(--color-accent);
            color: var(--color-white);
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 25px;
            font-family: var(--font-body);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            letter-spacing: 0.03em;
            box-shadow: 0 3px 10px rgba(201, 169, 110, 0.35);
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .image-area .btn-add-image:hover {
            background: var(--color-wine);
            box-shadow: 0 6px 18px rgba(114, 47, 55, 0.35);
            transform: translateY(-2px);
        }

        .image-area img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            padding: 0.5rem;
            max-height: 380px;
            transition: transform 0.3s;
        }

        /* ========== MODAL PARA IMAGEN ========== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            max-width: 90vw;
            max-height: 90vh;
            position: relative;
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .modal-content img {
            display: block;
            max-width: 100%;
            max-height: 85vh;
            object-fit: contain;
            user-select: none;
            transform: scale(1);
            transition: transform 0.2s;
        }

        .modal-close {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255,255,255,0.9);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            z-index: 10;
            transition: background 0.2s;
        }

        .modal-close:hover {
            background: #fff;
        }

        .modal-zoom-controls {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            background: rgba(255,255,255,0.9);
            padding: 6px 12px;
            border-radius: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .modal-zoom-controls button {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .modal-zoom-controls button:hover {
            background: rgba(0,0,0,0.1);
        }

        /* ========== SECCIÓN GRACIAS / SUERTE ========== */
        .thanks-section {
            text-align: center;
            margin-top: 3rem;
            padding: 2rem 1rem;
            background: rgba(255, 253, 249, 0.8);
            border-radius: var(--radius);
            border: 2px dashed var(--color-accent);
            position: relative;
        }

        .thanks-section h2 {
            font-family: var(--font-title);
            font-size: 2rem;
            color: var(--color-primary);
            margin-bottom: 0.5rem;
        }

        .thanks-section p {
            color: var(--color-text-light);
            margin-bottom: 1.5rem;
            font-style: italic;
        }

        .btn-luck {
            background: linear-gradient(135deg, var(--color-accent), var(--color-wine));
            color: white;
            border: none;
            padding: 0.9rem 2rem;
            border-radius: 30px;
            font-family: var(--font-body);
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            letter-spacing: 0.05em;
            box-shadow: 0 6px 20px rgba(114,47,55,0.4);
        }

        .btn-luck:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 28px rgba(114,47,55,0.5);
        }

        .btn-luck:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        /* ========== MODAL DE REGALOS ========== */
        .gift-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2500;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .gift-modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .gift-modal {
            background: var(--color-card);
            border-radius: var(--radius);
            padding: 1.5rem;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            text-align: center;
        }

        .gift-modal h3 {
            font-family: var(--font-title);
            font-size: 1.4rem;
            color: var(--color-primary);
            margin-bottom: 0.5rem;
        }

        .gift-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 1.5rem 0;
        }

        .gift-box {
            aspect-ratio: 1;
            background: linear-gradient(135deg, #f7e8d0, #e8d5b0);
            border: 2px solid var(--color-accent);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            box-shadow: 0 3px 8px var(--color-shadow);
        }

        .gift-box:hover:not(.opened) {
            transform: scale(1.05);
            box-shadow: 0 6px 16px var(--color-shadow-hover);
        }

        .gift-box.opened {
            cursor: default;
            pointer-events: none;
        }

        .gift-box.winner {
            background: linear-gradient(135deg, #ffe0b2, #ffcc80);
            border-color: #f57c00;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .gift-box.empty {
            background: #f0f0f0;
            border-color: #ccc;
        }

        .gift-close-btn {
            background: var(--color-secondary);
            color: white;
            border: none;
            padding: 0.6rem 1.5rem;
            border-radius: 25px;
            font-size: 0.9rem;
            cursor: pointer;
            margin-top: 1rem;
            font-weight: 600;
            transition: var(--transition);
        }

        .gift-close-btn:hover {
            background: var(--color-primary);
        }

        .attempts-info {
            font-size: 0.85rem;
            color: var(--color-text-light);
            margin-bottom: 0.5rem;
        }

        /* ========== PANTALLA DE SELECCIÓN DE CUENTA ========== */
        .account-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--color-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            padding: 1rem;
            overflow-y: auto;
        }

        .account-card {
            background: var(--color-card);
            border-radius: var(--radius);
            padding: 2rem;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 40px var(--color-shadow);
            border: 2px solid var(--color-accent);
            text-align: center;
        }

        .account-card h2 {
            font-family: var(--font-title);
            font-size: 1.8rem;
            color: var(--color-primary);
            margin-bottom: 0.5rem;
        }

        .account-card p {
            color: var(--color-text-light);
            margin-bottom: 1.5rem;
            font-style: italic;
        }

        .search-box {
            margin-bottom: 1rem;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1.5px solid var(--color-border);
            border-radius: 25px;
            font-family: var(--font-body);
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
            background: var(--color-white);
        }

        .search-box input:focus {
            border-color: var(--color-accent);
            box-shadow: 0 0 0 3px rgba(201,169,110,0.2);
        }

        .search-results {
            max-height: 200px;
            overflow-y: auto;
            margin-top: 0.5rem;
            text-align: left;
            border: 1px solid var(--color-border);
            border-radius: 8px;
            background: var(--color-white);
            display: none;
        }

        .search-results.active {
            display: block;
        }

        .search-results .result-item {
            padding: 0.6rem 1rem;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.95rem;
        }

        .search-results .result-item:hover {
            background: rgba(201,169,110,0.15);
        }

        .no-results {
            padding: 0.8rem;
            color: var(--color-text-light);
            font-style: italic;
            text-align: center;
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 768px) {
            .detail-grid { grid-template-columns: 1fr; gap: 1rem; }
            .categories-grid { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; }
            .category-card { padding: 1.2rem 0.8rem; }
            .category-card .icon { font-size: 2.2rem; }
            .category-card h3 { font-size: 1rem; }
            .image-area { min-height: 180px; }
            .image-area img { max-height: 250px; }
            .subtopic-item { padding: 0.9rem 1rem; font-size: 0.9rem; }
            .app-header h1 { font-size: 1.4rem; }
        }

        @media (max-width: 480px) {
            .categories-grid { grid-template-columns: 1fr 1fr; gap: 0.8rem; }
            .category-card { padding: 1rem 0.6rem; border-radius: var(--radius-sm); }
            .category-card .icon { font-size: 1.8rem; margin-bottom: 0.5rem; }
            .category-card h3 { font-size: 0.85rem; }
            .detail-grid { gap: 0.8rem; }
            .image-area { min-height: 150px; }
            .image-area .placeholder .icon { font-size: 2.5rem; }
            .breadcrumb { font-size: 0.75rem; padding: 0.4rem 1rem; }
            .app-header { padding: 1rem 1rem 0.5rem; }
            .app-header .restaurant-icon { font-size: 2rem; }
        }

        .hidden-input { display: none; }
    </style>
</head>
<body>

    <!-- Overlay de carga -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Pantalla de selección de cuenta -->
    <div class="account-screen" id="accountScreen">
        <div class="account-card">
            <h2>🍷 Selecciona tu cuenta</h2>
            <p>Escribe tu nombre para comenzar</p>
            <div class="search-box">
                <input type="text" id="accountSearch" placeholder="Buscar nombre..." autocomplete="off">
                <div class="search-results" id="searchResults"></div>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header class="app-header" style="display:none;">
        <span class="restaurant-icon">🍷</span>
        <h1>Formatos de Formularios</h1>
        <p class="subtitle">Restaurante de Categoría</p>
    </header>

    <!-- Barra de usuario -->
    <div class="user-bar" id="userBar" style="display:none;">
        <span class="user-name" id="userNameDisplay"></span>
        <button class="logout-btn" onclick="logout()">Cambiar cuenta</button>
    </div>

    <!-- Breadcrumb -->
    <nav class="breadcrumb" id="breadcrumb" style="display:none;">
        <button onclick="navigateHome()">Inicio</button>
    </nav>

    <!-- Contenido principal -->
    <main class="main-container" style="display:none;">

        <!-- Vista de Categorías -->
        <section class="view active" id="viewCategories">
            <p class="section-label">— Seleccione un departamento —</p>
            <div class="categories-grid" id="categoriesGrid"></div>

            <!-- Sección de agradecimiento y suerte -->
            <div class="thanks-section" id="thanksSection">
                <h2>¡Gracias por ver!</h2>
                <p>Has explorado nuestros formatos. ¿Quieres probar tu suerte?</p>
                <button class="btn-luck" id="btnLuck" onclick="openGiftModal()">🎁 Probar mi suerte</button>
            </div>
        </section>

        <!-- Vista de Subtemas -->
        <section class="view" id="viewSubtopics">
            <div class="subtopics-header" id="subtopicsHeader"></div>
            <div class="subtopics-list" id="subtopicsList"></div>
        </section>

        <!-- Vista de Detalle -->
        <section class="view" id="viewDetail">
            <div class="detail-header" id="detailHeader"></div>
            <div class="official-description-box" id="officialDescription"></div>
            <div class="detail-grid" id="detailGrid">
                <!-- Panel Izquierdo -->
                <div class="image-panel" id="panelLeft">
                    <div class="panel-label">📄 Imagen Izquierda</div>
                    <div class="image-area" id="imageAreaLeft" onclick="triggerFileInput('left')"></div>
                    <input type="file" accept="image/*" class="hidden-input" id="fileInputLeft" onchange="handleFileUpload('left', this)">
                </div>
                <!-- Panel Derecho -->
                <div class="image-panel" id="panelRight">
                    <div class="panel-label">📄 Imagen Derecha</div>
                    <div class="image-area" id="imageAreaRight" onclick="triggerFileInput('right')"></div>
                    <input type="file" accept="image/*" class="hidden-input" id="fileInputRight" onchange="handleFileUpload('right', this)">
                </div>
            </div>
        </section>

    </main>

    <!-- Modal para imagen ampliada -->
    <div class="modal-overlay" id="imageModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeImageModal()">✕</button>
            <img id="modalImage" src="" alt="Imagen ampliada" ondblclick="resetZoom()">
            <div class="modal-zoom-controls">
                <button onclick="zoomIn()">➕</button>
                <button onclick="zoomOut()">➖</button>
                <button onclick="resetZoom()">🔄</button>
            </div>
        </div>
    </div>

    <!-- Modal de regalos -->
    <div class="gift-modal-overlay" id="giftModal">
        <div class="gift-modal">
            <h3>🎁 ¡Regalos sorpresa!</h3>
            <p class="attempts-info" id="attemptsInfo"></p>
            <div class="gift-grid" id="giftGrid"></div>
            <button class="gift-close-btn" onclick="closeGiftModal()">Cerrar</button>
        </div>
    </div>

    <script>
        // ========== CONFIGURACIÓN DE FIREBASE ==========
        const firebaseConfig = {
            apiKey: "AIzaSyAsgV2Wwu97gIiOe5aIMfJ7U-p01GYLGOs",
            authDomain: "ftdr-61eb7.firebaseapp.com",
            databaseURL: "https://ftdr-61eb7-default-rtdb.firebaseio.com",
            projectId: "ftdr-61eb7",
            storageBucket: "ftdr-61eb7.firebasestorage.app",
            messagingSenderId: "1014103741073",
            appId: "1:1014103741073:web:4753fc3c56fd3b8dc6e530",
            measurementId: "G-7FJ5N0MZB8"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // ========== DATOS DE LA APLICACIÓN ==========
        const appData = [
            {
                name: "Sala/Servicio", icon: "🍽️", color: "#c9a96e",
                subtopics: [
                    { title: "Comanda (cocina/barra/caja)", description: "Registra los pedidos de los clientes para enviarlos al instante a cocina, barra o caja." },
                    { title: "Hoja de reservas", description: "Organiza las asignaciones de mesas, horarios y número de comensales del día." },
                    { title: "Plano de distribución de mesas", description: "Diagrama visual del comedor para optimizar la asignación del espacio y el flujo del servicio." },
                    { title: "Ficha de alérgenos por comensal", description: "Notifica restricciones alimentarias específicas de un cliente para evitar contaminación cruzada." },
                    { title: "BEO (Parte de banquetes y eventos)", description: "Documento con las instrucciones detalladas para la ejecución de eventos especiales." }
                ]
            },
            {
                name: "Cocina", icon: "👨‍🍳", color: "#e07b39",
                subtopics: [
                    { title: "Ficha técnica de plato", description: "Especifica ingredientes, gramajes, costes y pasos de preparación para estandarizar las recetas." },
                    { title: "Control de temperaturas APPCC/HACCP", description: "Registro obligatorio que garantiza la seguridad alimentaria en la conservación y cocción." },
                    { title: "Control de trazabilidad de alimentos", description: "Rastrea el origen, lote y recorrido de cada ingrediente desde su llegada." },
                    { title: "Hoja de mermas y desperdicios", description: "Cuantifica la materia prima perdida en elaboración o por deterioro para ajustar costes." },
                    { title: "Control de caducidades (PEPS/FIFO)", description: "Garantiza que lo primero en entrar sea lo primero en salir para evitar caducidades." }
                ]
            },
            {
                name: "Almacén/Compras", icon: "📦", color: "#6b8e4e",
                subtopics: [
                    { title: "Hoja de pedido a proveedores", description: "Solicitud formal de compra de insumos según las necesidades de inventario." },
                    { title: "Albarán de recepción de mercancía", description: "Comprueba que lo entregado por el proveedor coincida en cantidad y calidad con lo pedido." },
                    { title: "Control de stock e inventario", description: "Recuento físico del almacén para mantener el nivel óptimo de existencias." },
                    { title: "Control de temperatura de cámaras", description: "Monitoreo diario del funcionamiento de cámaras frigoríficas y congeladores." },
                    { title: "Control de rotación de stock (FIFO)", description: "Organización física del almacén para garantizar el uso prioritario de los productos más antiguos." }
                ]
            },
            {
                name: "Administración", icon: "📊", color: "#8b6f9e",
                subtopics: [
                    { title: "Control de caja diario", description: "Registro detallado de las entradas y salidas de efectivo durante la jornada." },
                    { title: "Arqueo/cierre de caja", description: "Verificación del dinero real disponible frente al reporte de ventas al finalizar el turno." },
                    { title: "Control de turnos y horarios", description: "Planificación de la jornada laboral, descansos y asistencia de la plantilla." },
                    { title: "Balance diario de ventas", description: "Resumen de los ingresos totales generados por canal, área o turno." },
                    { title: "Parte de incidencias", description: "Documenta imprevistos, averías o problemas operativos ocurridos durante el servicio." }
                ]
            }
        ];

        // ========== CUENTAS PREHECHAS ==========
        const accountNames = [
            "Zulma Esmeralda", "Lennin Alexis", "Priscila Alexandra", "Gabriel Eduardo",
            "Brayan Omar", "Jackeline Elizabeth", "Eduardo Alexander", "Gabriela De Los Angeles",
            "Julia Ester", "Alejandra Patricia", "Andrea Rebeca", "María Fernanda",
            "Susana Yamileth", "Keny Aracely", "Angel Enrique", "Wily Matthew",
            "Xiomara Yamileth", "Lucia Maite", "Julisa Elizabeth", "Dayana Yamileth",
            "Adriana Sarai", "Mónica Denisse", "Jackeline Patricia", "Camila Sofía",
            "Alisson Azucena", "Katherine Lizeth", "Marco Andrés", "Jeferson Isaac",
            "Claudia Raquel", "Alexi Antonio", "Eins", "Zwei", "Drei"
        ];

        // ========== ESTADO GLOBAL ==========
        let currentUser = null;
        let currentCategoryIndex = null;
        let currentSubtopicIndex = null;
        let currentImageData = { left: null, right: null };
        let isLoadingData = false;
        let giftState = {
            attemptsUsed: 0,
            winningBox: null,
            prize: null,
            boxesOpened: []
        };
        let currentZoom = 1;

        // ========== FUNCIONES DE CUENTA ==========
        function normalizeString(str) {
            return str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, ' ').trim();
        }

        function loadAccountScreen() {
            const savedUser = localStorage.getItem('currentUser');
            if (savedUser && accountNames.some(name => normalizeString(name) === normalizeString(savedUser))) {
                currentUser = savedUser;
                showMainApp();
                loadGiftStateFromFirebase(); // cargar regalos al iniciar sesión automática
            } else {
                document.getElementById('accountScreen').style.display = 'flex';
                document.getElementById('accountSearch').value = '';
                document.getElementById('searchResults').innerHTML = '';
                document.getElementById('searchResults').classList.remove('active');
                hideMainApp();
            }
        }

        function showMainApp() {
            document.getElementById('userBar').style.display = 'flex';
            document.getElementById('userNameDisplay').textContent = currentUser;
            document.querySelector('.app-header').style.display = 'block';
            document.querySelector('.breadcrumb').style.display = 'flex';
            document.querySelector('.main-container').style.display = 'block';
            renderCategories();
            updateBreadcrumb();
            updateGiftButton(); // actualizar botón inmediatamente con estado actual (puede no estar cargado aún)
        }

        function hideMainApp() {
            document.getElementById('userBar').style.display = 'none';
            document.querySelector('.app-header').style.display = 'none';
            document.querySelector('.breadcrumb').style.display = 'none';
            document.querySelector('.main-container').style.display = 'none';
        }

        function selectAccount(name) {
            currentUser = name;
            localStorage.setItem('currentUser', name);
            document.getElementById('accountScreen').style.display = 'none';
            showMainApp();
            loadGiftStateFromFirebase(); // cargar regalos después de seleccionar
        }

        function logout() {
            localStorage.removeItem('currentUser');
            currentUser = null;
            document.getElementById('accountScreen').style.display = 'flex';
            document.getElementById('accountSearch').value = '';
            document.getElementById('searchResults').innerHTML = '';
            document.getElementById('searchResults').classList.remove('active');
            hideMainApp();
        }

        // ========== BÚSQUEDA DE CUENTAS ==========
        document.addEventListener('DOMContentLoaded', function() {
            loadAccountScreen();

            const searchInput = document.getElementById('accountSearch');
            const searchResults = document.getElementById('searchResults');

            searchInput.addEventListener('input', function() {
                const query = normalizeString(this.value);
                if (query.length === 0) {
                    searchResults.innerHTML = '';
                    searchResults.classList.remove('active');
                    return;
                }

                const matches = accountNames.filter(name => normalizeString(name).includes(query));
                if (matches.length === 0) {
                    searchResults.innerHTML = '<div class="no-results">No se encontró ninguna cuenta</div>';
                    searchResults.classList.add('active');
                    return;
                }

                let html = '';
                matches.forEach(name => {
                    html += `<div class="result-item" data-name="${name}">${name}</div>`;
                });
                searchResults.innerHTML = html;
                searchResults.classList.add('active');

                searchResults.querySelectorAll('.result-item').forEach(item => {
                    item.addEventListener('click', function() {
                        const selectedName = this.getAttribute('data-name');
                        selectAccount(selectedName);
                    });
                });
            });

            document.addEventListener('click', function(e) {
                if (!e.target.closest('.search-box')) {
                    searchResults.classList.remove('active');
                }
            });

            searchInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    const query = normalizeString(this.value);
                    const exactMatch = accountNames.find(name => normalizeString(name) === query);
                    if (exactMatch) {
                        selectAccount(exactMatch);
                    } else {
                        const matches = accountNames.filter(name => normalizeString(name).includes(query));
                        if (matches.length === 1) {
                            selectAccount(matches[0]);
                        }
                    }
                }
            });

            // Cerrar modales al hacer clic fuera
            document.getElementById('imageModal').addEventListener('click', function(e) {
                if (e.target === this) closeImageModal();
            });
            document.getElementById('giftModal').addEventListener('click', function(e) {
                if (e.target === this) closeGiftModal();
            });
        });

        // ========== GESTIÓN DE REGALOS CON FIREBASE (CORREGIDO) ==========
        function getGiftRefForCurrentUser() {
            if (!currentUser) return null;
            // Crear clave única para Firebase (sin caracteres especiales)
            const userKey = currentUser.replace(/\s+/g, '_').replace(/[^a-zA-Z0-9_]/g, '');
            return database.ref(`giftStates/${userKey}`);
        }

        function isGiftStateValid(state) {
            return state &&
                typeof state.attemptsUsed === 'number' &&
                Array.isArray(state.boxesOpened) &&
                (state.winningBox === null || typeof state.winningBox === 'number') &&
                (state.prize === null || typeof state.prize === 'string');
        }

        function initializeGiftState() {
            return {
                attemptsUsed: 0,
                winningBox: Math.floor(Math.random() * 9),
                prize: ['Chocolate', 'Paleta', 'Dulce'][Math.floor(Math.random() * 3)],
                boxesOpened: []
            };
        }

        function loadGiftStateFromFirebase() {
            if (!currentUser) return;
            const ref = getGiftRefForCurrentUser();
            if (!ref) return;

            // Mostrar loading solo si no hay datos todavía
            if (!giftState || giftState.winningBox === null) {
                showLoading(true);
            }

            ref.once('value').then(snapshot => {
                const data = snapshot.val();
                if (isGiftStateValid(data)) {
                    giftState = data;
                } else {
                    // Si los datos no son válidos, crear un estado nuevo
                    giftState = initializeGiftState();
                    ref.set(giftState).catch(err => console.error('Error al guardar estado inicial:', err));
                }
                updateGiftButton();
                showLoading(false);
            }).catch(error => {
                console.error('Error cargando estado de regalos:', error);
                // Inicializar con valores por defecto en memoria para no bloquear la UI
                giftState = initializeGiftState();
                updateGiftButton();
                showLoading(false);
                showToast('Error al cargar regalos, usando estado temporal');
            });
        }

        function saveGiftStateToFirebase() {
            const ref = getGiftRefForCurrentUser();
            if (ref) {
                ref.set(giftState).catch(err => console.error('Error guardando regalos:', err));
            }
        }

        function updateGiftButton() {
            const btn = document.getElementById('btnLuck');
            if (!btn) return;
            // Si no hay usuario, deshabilitar
            if (!currentUser) {
                btn.disabled = true;
                btn.textContent = '🎁 Probar mi suerte';
                return;
            }
            // Asegurar que giftState tenga la propiedad attemptsUsed como número
            const attempts = typeof giftState.attemptsUsed === 'number' ? giftState.attemptsUsed : 0;
            const remaining = 2 - attempts;
            if (remaining <= 0) {
                btn.disabled = true;
                btn.textContent = '🎁 Sin intentos restantes';
            } else {
                btn.disabled = false;
                btn.textContent = `🎁 Probar mi suerte (${remaining} intento${remaining > 1 ? 's' : ''})`;
            }
        }

        function openGiftModal() {
            if (!currentUser) return;
            if (giftState.attemptsUsed >= 2) {
                showToast('Ya has usado tus 2 intentos');
                return;
            }
            document.getElementById('giftModal').classList.add('active');
            renderGiftBoxes();
        }

        function closeGiftModal() {
            document.getElementById('giftModal').classList.remove('active');
        }

        function renderGiftBoxes() {
            const grid = document.getElementById('giftGrid');
            grid.innerHTML = '';
            const attemptsInfo = document.getElementById('attemptsInfo');
            const remaining = 2 - giftState.attemptsUsed;
            attemptsInfo.textContent = `Intentos restantes: ${remaining}`;

            for (let i = 0; i < 9; i++) {
                const box = document.createElement('div');
                box.className = 'gift-box';
                if (giftState.boxesOpened.includes(i)) {
                    box.classList.add('opened');
                    if (i === giftState.winningBox) {
                        box.classList.add('winner');
                        box.textContent = '🎁';
                    } else {
                        box.classList.add('empty');
                        box.textContent = '😞';
                    }
                } else {
                    box.textContent = '🎀';
                    box.addEventListener('click', () => openGiftBox(i, box));
                }
                grid.appendChild(box);
            }
        }

        function openGiftBox(index, boxElement) {
            if (giftState.attemptsUsed >= 2) {
                showToast('Sin intentos');
                return;
            }
            if (giftState.boxesOpened.includes(index)) return;

            giftState.attemptsUsed++;
            giftState.boxesOpened.push(index);
            saveGiftStateToFirebase();

            if (index === giftState.winningBox) {
                boxElement.classList.add('winner');
                boxElement.textContent = '🎁';
                showToast(`¡Felicidades! Ganaste: ${giftState.prize}`);
            } else {
                boxElement.classList.add('empty');
                boxElement.textContent = '😞';
                showToast('No tuviste suerte esta vez');
            }
            boxElement.classList.add('opened');
            boxElement.style.pointerEvents = 'none';

            updateGiftButton();
            if (giftState.attemptsUsed >= 2) {
                setTimeout(() => {
                    closeGiftModal();
                    if (!giftState.boxesOpened.includes(giftState.winningBox)) {
                        showToast('No ganaste, pero gracias por participar');
                    }
                }, 1500);
            }
        }

        // ========== NAVEGACIÓN ==========
        function showView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function navigateHome() {
            currentCategoryIndex = null;
            currentSubtopicIndex = null;
            showView('viewCategories');
            updateBreadcrumb();
        }

        function openSubtopics(catIndex) {
            currentCategoryIndex = catIndex;
            currentSubtopicIndex = null;
            showView('viewSubtopics');
            renderSubtopics(catIndex);
            updateBreadcrumb();
        }

        function navigateToSubtopic(catIndex, subIndex) {
            currentCategoryIndex = catIndex;
            currentSubtopicIndex = subIndex;
            showView('viewDetail');
            updateBreadcrumb();
            loadDetailData();
            renderDetailHeader();
        }

        function updateBreadcrumb() {
            const bc = document.getElementById('breadcrumb');
            let html = '<button onclick="navigateHome()">Inicio</button>';
            if (currentCategoryIndex !== null) {
                html += '<span class="separator">›</span>';
                html += `<button onclick="openSubtopics(${currentCategoryIndex})">${appData[currentCategoryIndex].icon} ${appData[currentCategoryIndex].name}</button>`;
            }
            if (currentCategoryIndex !== null && currentSubtopicIndex !== null) {
                html += '<span class="separator">›</span>';
                html += `<span class="current">${appData[currentCategoryIndex].subtopics[currentSubtopicIndex].title}</span>`;
            }
            bc.innerHTML = html;
        }

        // ========== RENDER ==========
        function renderCategories() {
            const grid = document.getElementById('categoriesGrid');
            grid.innerHTML = '';
            appData.forEach((cat, index) => {
                const card = document.createElement('div');
                card.className = 'category-card';
                card.innerHTML = `
                    <span class="icon">${cat.icon}</span>
                    <h3>${cat.name}</h3>
                    <span class="item-count">${cat.subtopics.length} formatos disponibles</span>
                `;
                card.addEventListener('click', () => openSubtopics(index));
                card.style.borderTop = `3px solid ${cat.color}`;
                grid.appendChild(card);
            });
        }

        function renderSubtopics(catIndex) {
            const cat = appData[catIndex];
            document.getElementById('subtopicsHeader').innerHTML = `
                <span class="cat-icon">${cat.icon}</span>
                <h2>${cat.name}</h2>
            `;
            const list = document.getElementById('subtopicsList');
            list.innerHTML = '';
            cat.subtopics.forEach((sub, index) => {
                const item = document.createElement('div');
                item.className = 'subtopic-item';
                item.innerHTML = `
                    <span class="number">${index + 1}</span>
                    <span>${sub.title}</span>
                    <span class="arrow">→</span>
                `;
                item.addEventListener('click', () => navigateToSubtopic(catIndex, index));
                list.appendChild(item);
            });
        }

        function renderDetailHeader() {
            const cat = appData[currentCategoryIndex];
            const sub = cat.subtopics[currentSubtopicIndex];
            document.getElementById('detailHeader').innerHTML = `
                <h2>${sub.title}</h2>
                <p class="breadcrumb-hint">${cat.icon} ${cat.name}</p>
            `;
            document.getElementById('officialDescription').textContent = sub.description || '';
        }

        // ========== CARGA Y GUARDADO DE IMÁGENES (FIREBASE) ==========
        function showLoading(show) {
            document.getElementById('loadingOverlay').classList.toggle('visible', show);
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('visible');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => toast.classList.remove('visible'), 2500);
        }

        function sanitizeKey(str) {
            return str.toLowerCase()
                .replace(/á/g, 'a').replace(/é/g, 'e').replace(/í/g, 'i')
                .replace(/ó/g, 'o').replace(/ú/g, 'u').replace(/ñ/g, 'n')
                .replace(/[^a-z0-9_]/g, '_').replace(/_+/g, '_').replace(/^_|_$/g, '');
        }

        function getFirebasePath(catIndex, subIndex) {
            const catKey = sanitizeKey(appData[catIndex].name);
            const subKey = sanitizeKey(appData[catIndex].subtopics[subIndex].title);
            return `formats/${catKey}/${subKey}`;
        }

        function loadDetailData() {
            if (currentCategoryIndex === null || currentSubtopicIndex === null) return;
            const path = getFirebasePath(currentCategoryIndex, currentSubtopicIndex);
            const ref = database.ref(path);
            isLoadingData = true;
            showLoading(true);

            ref.once('value').then(snapshot => {
                const data = snapshot.val() || {};
                currentImageData.left = data.leftImage || null;
                currentImageData.right = data.rightImage || null;
                updateImageArea('left');
                updateImageArea('right');
                isLoadingData = false;
                showLoading(false);
            }).catch(error => {
                console.error('Error al cargar datos:', error);
                isLoadingData = false;
                showLoading(false);
                showToast('⚠️ Error al cargar datos guardados');
            });
        }

        function saveImages() {
            if (currentCategoryIndex === null || currentSubtopicIndex === null) return;
            if (isLoadingData) return;
            const path = getFirebasePath(currentCategoryIndex, currentSubtopicIndex);
            const ref = database.ref(path);
            ref.set({
                leftImage: currentImageData.left,
                rightImage: currentImageData.right
            }).then(() => {
                console.log('Imágenes guardadas');
            }).catch(error => {
                console.error('Error al guardar:', error);
                showToast('⚠️ Error al guardar');
            });
        }

        // ========== MANEJO DE IMÁGENES ==========
        function triggerFileInput(side) {
            if (currentImageData[side]) {
                showToast('ℹ️ Ya hay una imagen en este espacio');
                return;
            }
            const input = document.getElementById(`fileInput${side.charAt(0).toUpperCase() + side.slice(1)}`);
            input.click();
        }

        function handleFileUpload(side, inputElement) {
            const file = inputElement.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) {
                showToast('⚠️ Por favor selecciona una imagen válida');
                inputElement.value = '';
                return;
            }
            compressImage(file, 800, 0.7).then(base64 => {
                currentImageData[side] = base64;
                updateImageArea(side);
                saveImages();
                showToast(`✅ Imagen ${side === 'left' ? 'izquierda' : 'derecha'} agregada`);
                inputElement.value = '';
            }).catch(error => {
                console.error(error);
                showToast('⚠️ Error al procesar imagen');
                inputElement.value = '';
            });
        }

        function compressImage(file, maxWidth, quality) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = e => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) {
                            const ratio = maxWidth / width;
                            width = maxWidth;
                            height = Math.round(height * ratio);
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function updateImageArea(side) {
            const areaId = side === 'left' ? 'imageAreaLeft' : 'imageAreaRight';
            const area = document.getElementById(areaId);
            const hasImage = currentImageData[side] !== null;

            if (hasImage) {
                area.classList.add('has-image');
                area.innerHTML = `<img src="${currentImageData[side]}" alt="Imagen ${side}" ondblclick="openImageModal('${side}')">`;
                area.onclick = null;
            } else {
                area.classList.remove('has-image');
                area.innerHTML = `
                    <div class="placeholder">
                        <span class="icon">🖼️</span>
                        <p>Sin imagen</p>
                        <button class="btn-add-image" onclick="event.stopPropagation(); triggerFileInput('${side}')">📤 Agregar imagen</button>
                        <small style="font-size:0.7rem; opacity:0.6;">Solo se puede agregar una imagen</small>
                    </div>
                `;
                area.onclick = () => triggerFileInput(side);
            }
        }

        // ========== MODAL DE IMAGEN ==========
        function openImageModal(side) {
            const imgSrc = currentImageData[side];
            if (!imgSrc) return;
            const modal = document.getElementById('imageModal');
            const img = document.getElementById('modalImage');
            img.src = imgSrc;
            img.style.transform = 'scale(1)';
            currentZoom = 1;
            modal.classList.add('active');
        }

        function closeImageModal() {
            document.getElementById('imageModal').classList.remove('active');
        }

        function zoomIn() {
            currentZoom = Math.min(currentZoom + 0.2, 3);
            document.getElementById('modalImage').style.transform = `scale(${currentZoom})`;
        }

        function zoomOut() {
            currentZoom = Math.max(currentZoom - 0.2, 0.5);
            document.getElementById('modalImage').style.transform = `scale(${currentZoom})`;
        }

        function resetZoom() {
            currentZoom = 1;
            document.getElementById('modalImage').style.transform = 'scale(1)';
        }

        // ========== SOPORTE PARA PEGAR IMÁGENES ==========
        document.addEventListener('paste', function(e) {
            if (currentCategoryIndex === null || currentSubtopicIndex === null) return;
            if (!document.getElementById('viewDetail').classList.contains('active')) return;
            const items = e.clipboardData?.items;
            if (!items) return;
            for (let i = 0; i < items.length; i++) {
                if (items[i].type.startsWith('image/')) {
                    e.preventDefault();
                    const file = items[i].getAsFile();
                    let targetSide = null;
                    if (!currentImageData.left) targetSide = 'left';
                    else if (!currentImageData.right) targetSide = 'right';
                    if (!targetSide) {
                        showToast('⚠️ Ambos espacios ya tienen imagen');
                        return;
                    }
                    compressImage(file, 800, 0.7).then(base64 => {
                        currentImageData[targetSide] = base64;
                        updateImageArea(targetSide);
                        saveImages();
                        showToast(`✅ Imagen pegada en el espacio ${targetSide === 'left' ? 'izquierdo' : 'derecho'}`);
                    }).catch(err => {
                        console.error(err);
                        showToast('⚠️ Error al procesar imagen');
                    });
                    break;
                }
            }
        });
    </script>
</body>
</html>
